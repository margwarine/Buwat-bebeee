<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BUATT BEBE</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap" rel="stylesheet">
</head>

<body>

  <!-- HALAMAN AMPLOP -->
  <div id="amplop-container">
    <img src="aamplop.png" id="amplop" alt="Amplop">
    <p>Cie, Mingdep ujian~</p>
  </div>

  <!-- HALAMAN WADAH -->
  <div id="letter-container">

      <img src="wadah.png" class="wadah-art" alt="Wadah surat">

      <div class="letter-content">

        <img
          src="Cat Sup GIF.gif"
          class="cat"
          id="letter-cat"
          alt="Cute cat"

        <div class="buttons" id="letter-buttons">
          <img src="tidak.png" class="btn no-btn" alt="No">
          <img src="iya.png" class="btn yes-btn" alt="Yes">
        </div>

        <p id="final-text">
          <strong>Yang semangat dong!</strong><br>
          Aku yakin bebe pastii bisa!!
        </p>

      </div>
    </div>
  </div>

  <script src="script.js"></script>

</html>
